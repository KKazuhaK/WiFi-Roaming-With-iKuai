name: release

# Trigger: push a git tag matching v*.*.*.
#
#   web      → builds the React bundle once
#   build    → cross-compiles linux/amd64 + linux/arm64 natively, in parallel,
#              with the bundle embedded
#   docker   → reuses those binaries for the multi-arch ghcr.io push and the
#              Mode C offline tarballs
#   release  → packages the binaries, computes checksums, publishes the Release
#
# The split exists because the frontend build made the old single-job flow
# untenable: it compiled the image three times (multi-arch push plus one --load
# per architecture), so adding a node stage would have meant running `npm ci`
# under arm64 QEMU emulation — tens of minutes for a bundle that takes three
# seconds natively. Here the bundle is built once and the images only COPY a
# finished binary, so the only emulated work left is `apk add` of three packages.
#
# It also means the binary you sha256-verify from the Release is byte-identical
# to the one inside the container image: both come from the same artifact.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*.*.*"

# Release workflow needs contents write for releases and packages write for ghcr.io push.
permissions:
  contents: write
  packages: write

jobs:
  setup:
    name: Resolve tag and image name
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # ghcr.io requires a lowercase owner while github.repository_owner preserves
      # the original casing.
      - name: compute lowercase image name
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/wifi-portal" >> "$GITHUB_OUTPUT"

  web:
    name: Build web bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/web-react/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: build
        # vite.config.ts writes to ../internal/web/dist for //go:embed.
        run: npm run build

      - name: dist smoke check
        run: npm run smoke:dist

      - name: upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: portal/internal/web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
          cache-dependency-path: portal/go.sum

      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: portal/internal/web/dist

      - name: build binary
        working-directory: portal
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o out/portal .
          # A binary without the bundle would start and then answer every page
          # with the "frontend bundle not built" error. Cheap to catch here,
          # expensive to discover from a release asset.
          if ! grep -q "PORTAL_HEAD" out/portal; then
            echo "built binary does not contain the embedded bundle marker"
            exit 1
          fi

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: portal-linux-${{ matrix.goarch }}
          path: portal/out/portal
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - uses: actions/checkout@v4

      - name: download linux/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: portal-linux-amd64
          path: bin/linux-amd64

      - name: download linux/arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: portal-linux-arm64
          path: bin/linux-arm64

      # Still needed: Dockerfile.release has no build toolchain, but its
      # `apk add` runs in the target architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: portal/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.setup.outputs.image }}:${{ github.ref_name }}
            ${{ needs.setup.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mode C (Synology / iKuai UI) loads an image from a tarball, and buildx
      # can only --load one platform at a time.
      - name: save per-arch tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --load \
              -t "wifi-portal:${arch}" \
              -f portal/Dockerfile.release .
            docker save "wifi-portal:${arch}" \
              | gzip > "dist/wifi-portal-${{ github.ref_name }}-${arch}.tar.gz"
          done

      - name: upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: image-tarballs
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, build, docker]
    steps:
      - name: download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: portal-linux-*

      - name: download tarballs
        uses: actions/download-artifact@v4
        with:
          name: image-tarballs
          path: dist

      - name: assemble release assets
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            src="artifacts/portal-linux-${arch}/portal"
            dst="dist/wifi-portal-${{ github.ref_name }}-linux-${arch}"
            cp "$src" "$dst"
            chmod +x "$dst"
          done
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag-triggered push events already carry tag_name; softprops picks it up by default.
          files: dist/*
          generate_release_notes: true
          # body can include fixed guidance such as image addresses; generated notes cover commits.
          body: |
            ### Docker image (ghcr.io)
            ```bash
            docker pull ${{ needs.setup.outputs.image }}:latest
            # Or specific version.
            docker pull ${{ needs.setup.outputs.image }}:${{ github.ref_name }}
            ```

            ### Offline deployment (Mode C)
            Download `wifi-portal-<tag>-<arch>.tar.gz` from Assets below:
            ```bash
            gunzip -c wifi-portal-${{ github.ref_name }}-amd64.tar.gz | docker load
            ```

            ### Verify
            ```bash
            sha256sum -c checksums.txt
            ```

            ### Upgrading from an older release
            Nothing to do. On first start the portal imports the values from
            `.env` and the JSON state files under `DATA_DIR`, then reads only its
            database. After that, configuration is edited in **/admin → Settings**
            (or with `wifi-portal config set`) — editing `.env` no longer has an
            effect, apart from the bootstrap variables `SESSION_SECRET`,
            `ENCRYPTION_KEY`, `DATA_DIR`, `DB_DSN`, `DB_MAX_OPEN_CONNS`,
            `LISTEN_ADDR` and `TRUST_PROXY`.

            Set `ENCRYPTION_KEY` (`openssl rand -hex 32`) before the first start
            of the new version, or the credentials imported into the database are
            stored in plaintext. See the README for the full picture.
