name: build

# Runs on push / PR and verifies:
#   (1) The Go code still compiles with only the dist placeholder — the property
#       that lets a contributor without Node build the project.
#   (2) The React bundle typechecks, builds, and passes the dist smoke check.
#   (3) Go build / vet / test against the real bundle, including race detector.
#   (4) The same Go tests against real MySQL and PostgreSQL servers.
#   (5) govulncheck dependency and stdlib CVE scan.
#   (6) Docker image build.
#
# When Go is not installed locally, this workflow is the compiler and test machine.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # portal/internal/web/dist ships with nothing but .gitkeep, which is what lets
  # `//go:embed all:dist` compile on a fresh clone. That guarantee is easy to
  # break — an embed directive change, a stray file pattern — and the break would
  # only show up for someone cloning without Node installed. This job is that
  # someone.
  go-build-clean:
    name: Go build without the frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.13"
          cache: true
          cache-dependency-path: portal/go.sum

      - name: confirm dist holds only the placeholder
        run: |
          set -euo pipefail
          found=$(find internal/web/dist -type f | sort)
          if [ "$found" != "internal/web/dist/.gitkeep" ]; then
            echo "unexpected tracked files under internal/web/dist:"
            echo "$found"
            echo "the build output must stay git-ignored; see .gitignore"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -v ./...

  web:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/web-react/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: build
        # `npm run build` runs `tsc -b` first, so this covers the typecheck.
        run: npm run build

      # Checks the entry markers the Go handler rewrites, the content hashes the
      # immutable caching depends on, the .br/.gz siblings, and the brotli budget
      # on the captive-portal entry.
      - name: dist smoke check
        run: npm run smoke:dist

      - name: upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: portal/internal/web/dist
          if-no-files-found: error
          retention-days: 1

  go-test:
    name: Go test against the real bundle
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the toolchain directive in portal/go.mod. govulncheck reports
          # against the stdlib that built the binary, so a machine with an older
          # patch release would fail the scan on CVEs the code has already moved
          # past. setup-go resolves ">=" to the latest satisfying version.
          go-version: ">=1.25.13"
          cache: true
          cache-dependency-path: portal/go.sum

      # spa_bundle_test.go skips itself when only the placeholder is present, so
      # without this the tests that check the Vite output against the Go handler
      # would quietly never run — exactly the seam they exist to cover.
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: portal/internal/web/dist

      - name: go test (race detector)
        run: go test -race -count=1 ./...

      - name: go test (coverage)
        run: go test -count=1 -cover ./...

  # Everything above runs against SQLite. That is the default deployment and it
  # is what a contributor has locally, but it is not what "MySQL and PostgreSQL
  # are supported" means: the three engines disagree about upsert syntax, about
  # whether SELECT ... FOR UPDATE exists, about LIKE case-sensitivity and about
  # timestamp precision. Every one of those differences is load-bearing here —
  # guest-code redemption is a locked read-modify-write, the settings store is an
  # upsert, and the admin search is a LIKE. So the suite runs again against real
  # servers, with TEST_DB_DSN pointing the shared test helper at them.
  go-test-databases:
    name: Go test against ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            dsn: "postgres://portal:portal@127.0.0.1:5432/wifi_portal_test?sslmode=disable"
          - engine: mysql
            dsn: "portal:portal@tcp(127.0.0.1:3306)/wifi_portal_test?parseTime=true&loc=UTC"
    defaults:
      run:
        working-directory: portal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: wifi_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: portal
          MYSQL_DATABASE: wifi_portal_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uportal -pportal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.13"
          cache: true
          cache-dependency-path: portal/go.sum

      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: portal/internal/web/dist

      # -p 1 because the shared database is emptied at the start of each test:
      # two packages running concurrently against one server would clear each
      # other's rows. The suite is a few seconds, so serialising costs nothing.
      - name: go test
        env:
          TEST_DB_DSN: ${{ matrix.dsn }}
        run: go test -count=1 -p 1 ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches the toolchain directive in portal/go.mod. govulncheck reports
          # against the stdlib that built the binary, so a machine with an older
          # patch release would fail the scan on CVEs the code has already moved
          # past. setup-go resolves ">=" to the latest satisfying version.
          go-version: ">=1.25.13"
          cache: true
          cache-dependency-path: portal/go.sum

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: govulncheck ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/web-react/package-lock.json
      - run: npm ci
      # The frontend dependency tree is new attack surface for a project that
      # previously had two Go dependencies; govulncheck has no visibility into
      # it. High and critical advisories fail the build.
      - name: audit
        run: npm audit --audit-level=high

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [go-build-clean, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Exercises the full build-from-source path, node stage included — the one
      # `docker compose up -d --build` uses.
      - name: Build image without push, only verify Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: portal
          file: portal/Dockerfile
          push: false
          tags: wifi-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
